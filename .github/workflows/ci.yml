name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Levantar Kafka y PostgreSQL
        run: make up
      - run: npm run test:integration
      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color
      - name: Detener el entorno
        if: always()
        run: make down

  # H2: cada proceso tiene su imagen; se construye y se arranca de verdad (no solo se compila).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [api, relay, projector, auditor, notifier, graphql, decider]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir la imagen
        run: docker build --build-arg APP=${{ matrix.app }} -t bidstream-${{ matrix.app }}:test .
      - name: Levantar Kafka y PostgreSQL
        run: make up
      - name: Prueba de humo
        run: scripts/docker-smoke.sh ${{ matrix.app }}
      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color
      - name: Detener el entorno
        if: always()
        run: make down

  # I1: «puesta en marcha en un solo comando» comprobada en un entorno limpio.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Todo el sistema en un comando
        run: make demo
      - name: Flujo completo (API → Kafka → PostgreSQL → GraphQL)
        run: scripts/demo-smoke.sh
      - name: Logs de los contenedores
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Detener el entorno
        if: always()
        run: make down
