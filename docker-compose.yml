# Entorno local: Kafka (KRaft, sin Zookeeper) + PostgreSQL. Uso: `make up`.
name: bidstream

# Configuración común de los procesos de la aplicación (perfil `app`, `make demo`). NODE_ENV=development
# porque la API y GraphQL no arrancan en producción hasta F1 (autenticación, Q4): es una demostración local.
x-app: &app
  profiles: [app]
  restart: unless-stopped
  # F3: claves PÚBLICAS de verificación (las genera `make demo`; opcionales)
  env_file:
    - path: .env.signing.public
      required: false
  depends_on:
    kafka: { condition: service_healthy }
    postgres: { condition: service_healthy }
  environment:
    NODE_ENV: development
    DATABASE_URL: postgresql://${POSTGRES_USER:-bidstream}:${POSTGRES_PASSWORD:-bidstream}@postgres:5432/${POSTGRES_DB:-bidstream}
    KAFKA_BROKERS: kafka:19092
    KAFKA_LOG_LEVEL: error

x-health-api: &health-api
  test:
    [
      'CMD',
      'node',
      '-e',
      "fetch('http://localhost:3000/v1/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
    ]
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 5s

x-health-graphql: &health-graphql
  test:
    [
      'CMD',
      'node',
      '-e',
      "fetch('http://localhost:4000/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
    ]
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 5s

services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: bidstream-kafka
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - bidstream_kafka:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.3.2
    container_name: bidstream-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    volumes:
      - ./scripts/local/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ['/bin/sh', '/scripts/create-topics.sh']
    environment:
      BOOTSTRAP_SERVER: kafka:19092

  postgres:
    image: postgres:16-alpine
    container_name: bidstream-postgres
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bidstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bidstream}
      POSTGRES_DB: ${POSTGRES_DB:-bidstream}
    volumes:
      - bidstream_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bidstream} -d ${POSTGRES_DB:-bidstream}']
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Aplicación: una imagen por proceso, construida con el Dockerfile (H2) ---
  api:
    <<: *app
    build: { context: ., args: { APP: api } }
    image: bidstream-api:local
    ports: ['${API_PORT:-3000}:3000']
    healthcheck: *health-api

  graphql:
    <<: *app
    build: { context: ., args: { APP: graphql } }
    image: bidstream-graphql:local
    ports: ['${GRAPHQL_PORT:-4000}:4000']
    healthcheck: *health-graphql

  relay:
    <<: *app
    # la clave PRIVADA de firma solo la tiene el relay
    env_file:
      - path: .env.signing.public
        required: false
      - path: .env.signing.private
        required: false
    build: { context: ., args: { APP: relay } }
    image: bidstream-relay:local

  projector:
    <<: *app
    build: { context: ., args: { APP: projector } }
    image: bidstream-projector:local

  decider:
    <<: *app
    build: { context: ., args: { APP: decider } }
    image: bidstream-decider:local

  closer:
    <<: *app
    build: { context: ., args: { APP: closer } }
    image: bidstream-closer:local

  auditor:
    <<: *app
    build: { context: ., args: { APP: auditor } }
    image: bidstream-auditor:local

  notifier:
    <<: *app
    build: { context: ., args: { APP: notifier } }
    image: bidstream-notifier:local

volumes:
  bidstream_kafka:
  bidstream_pg:
